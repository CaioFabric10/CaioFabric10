name: Metrics
run-name: Atualizar estatisticas do perfil

on:
  push:
    paths:
      - ".github/workflows/metrics.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Verify private repository access
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --header "Authorization: Bearer $METRICS_TOKEN" \
            https://api.github.com/repos/CaioFabric10/escritorio-sistema)
          test "$status" = "200"
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_indepth: yes
          plugin_languages_indepth_custom: CaioFabric10/escritorio-sistema@master
          plugin_languages_limit: 8
          commits_authoring: caiofabricio07@gmail.com
