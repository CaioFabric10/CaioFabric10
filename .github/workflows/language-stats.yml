name: Language Statistics

on:
  push:
    paths:
      - ".github/workflows/language-stats.yml"
      - "scripts/generate_language_stats.py"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: language-statistics
  cancel-in-progress: false

jobs:
  generate-language-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate language statistics
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python scripts/generate_language_stats.py

      - name: Commit generated SVG
        run: |
          cache_key=$(git hash-object language-stats.svg)
          sed -i -E "s#language-stats\.svg(\?v=[^\"]*)?#language-stats.svg?v=$cache_key#" README.md

          if [ -z "$(git status --porcelain -- language-stats.svg README.md)" ]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add language-stats.svg README.md
          git commit -m "chore: update language statistics"

          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done

          exit 1
