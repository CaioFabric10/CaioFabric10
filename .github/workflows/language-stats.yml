name: Language Statistics

on:
  push:
    paths:
      - ".github/workflows/language-stats.yml"
      - "scripts/generate_language_stats.py"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-language-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate language statistics
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python scripts/generate_language_stats.py
      - name: Commit generated SVG
        run: |
          if git diff --quiet -- language-stats.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add language-stats.svg
          git commit -m "chore: update language statistics"
          git push
